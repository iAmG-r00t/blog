  }());

<!--
Load post-list clap counts from server-rendered Applause components.
-->
<script>
  function loadClapCounts() {
    var elements = Array.from(document.querySelectorAll('.clap-count[data-url]'));

    elements.forEach(function(element) {
      if (element.getAttribute('data-clap-loading') === 'true') return;
      element.setAttribute('data-clap-loading', 'true');

      var applause = element.querySelector('.clap-count-source');
      if (!applause) return;

      var finish = function() {
        var sourceCount = applause.querySelector('.count, .clap-count');
        var count = sourceCount && parseInt(sourceCount.textContent.replace(/,/g, ''), 10);
        if (!Number.isFinite(count)) return false;

        if (count > 0) {
          var sourceIcon = applause.querySelector('svg');
          var countSpan = document.createElement('span');
          countSpan.textContent = count;

          element.replaceChildren();
          if (sourceIcon) {
            var icon = sourceIcon.cloneNode(true);
            var flat = icon.querySelector('.hands-flat');
            var outline = icon.querySelector('.hands-outline');
            if (flat) flat.setAttribute('class', 'flat');
            if (outline) outline.setAttribute('class', 'outline');
            element.appendChild(icon);
          }
          element.appendChild(countSpan);
          element.style.display = 'initial';
        } else {
          element.replaceChildren();
        }

        observer.disconnect();
        return true;
      };

      var observer = new MutationObserver(finish);
      observer.observe(applause, { childList: true, subtree: true, characterData: true });
      finish();
    });
  }

  loadClapCounts();
  var pushState = document.getElementById('_pushState');
  if (pushState) pushState.addEventListener('hy-push-state-load', loadClapCounts);
</script>
